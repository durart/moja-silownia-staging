name: Publish isolated Moja Silownia staging
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: staging-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Progress 3 feature branch
        uses: actions/checkout@v4
        with:
          repository: durart/moja-silownia
          ref: feature/progress-3-foundation-20261123
          persist-credentials: false
      - name: Verify and prepare isolated staging site
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f progress-core-v2.js
          test -f progress-ui-v2.js
          node --check progress-core-v2.js
          node --check progress-ui-v2.js
          node --test tests/*.test.cjs tests/*.test.mjs
          node --check sw.js
          node --check assistant/assistant-core.js
          grep -q 'v3.0.0' index.html
          mkdir -p "$RUNNER_TEMP/staging-site"
          tar --exclude=.git --exclude=.github --exclude=tests --exclude=node_modules -cf - . | tar -xf - -C "$RUNNER_TEMP/staging-site"
          printf '%s\n' 'STAGING ONLY - Progress 3.0' > "$RUNNER_TEMP/staging-site/STAGING.txt"
          # Prevent the staging application from reading or overwriting the production workout state.
          find "$RUNNER_TEMP/staging-site" -type f \( -name '*.js' -o -name '*.html' \) -print0 | xargs -0 sed -i 's/moja-silownia-v01/moja-silownia-staging-progress3-v01/g'
          if grep -R -l 'moja-silownia-v01' "$RUNNER_TEMP/staging-site" --include='*.js' --include='*.html'; then
            echo 'Production storage key found in staging package' >&2
            exit 1
          fi
          grep -q 'moja-silownia-staging-progress3-v01' "$RUNNER_TEMP/staging-site/index.html"
          grep -q "key='moja-silownia-staging-progress3-v01'" "$RUNNER_TEMP/staging-site/modules/state-storage.js"
          grep -q 'createStateStorage(window.localStorage)' "$RUNNER_TEMP/staging-site/modules/bootstrap.js"
          # Service-worker caches are origin-wide; use a separate cache namespace.
          sed -i 's/moja-silownia-shell-v42-progress-3.0.0/moja-silownia-staging-progress3-shell-v12/g' "$RUNNER_TEMP/staging-site/sw.js"
          sed -i "s/startsWith('moja-silownia-shell-')/startsWith('moja-silownia-staging-progress3-shell-')/g" "$RUNNER_TEMP/staging-site/sw.js"
          grep -q "startsWith('moja-silownia-staging-progress3-shell-')" "$RUNNER_TEMP/staging-site/sw.js"
          if grep -q "startsWith('moja-silownia-shell-')" "$RUNNER_TEMP/staging-site/sw.js"; then
            echo 'Staging worker must not delete production caches' >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/staging-site
      - name: Allow artifact metadata to propagate
        run: sleep 20
      - name: Deploy staging to separate repository Pages
        id: deployment
        uses: actions/deploy-pages@v4
